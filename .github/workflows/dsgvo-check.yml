name: DSGVO-Check

on:
  push:
  pull_request:

jobs:
  external-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keine externen Ressourcen
        run: python3 scripts/check-external.py
      - name: Cache-Versionen aktuell
        run: python3 scripts/asset-versions.py --check
