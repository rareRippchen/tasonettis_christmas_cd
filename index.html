<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tastonettis – Klavier To Go</title>
  <meta name="description" content="Frohe Weihnachten von den Tastonettis! Hört „Klavier To Go“ jetzt auf eurem Lieblings-Streamingdienst.">
  <meta name="theme-color" content="#f4f7fb" id="theme-color">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("snowed");</script>
</head>
<body>
  <canvas id="snowfall" aria-hidden="true"></canvas>

  <main class="page">
    <header class="header">
      <a class="logo" href="https://tastonettis.de/" target="_blank" rel="noopener">
        <img src="assets/tastonettis-logo.svg" alt="Tastonettis" width="282" height="59">
      </a>
      <p class="greeting">🎄 Frohe Weihnachten 🎄</p>
    </header>

    <section class="release">
      <img class="cover" src="assets/cover-klavier-to-go.jpg" alt="Albumcover „Klavier To Go“" width="280" height="280">
      <h1 class="title">Klavier To Go</h1>
      <p class="artist">Tastonettis</p>
    </section>

    <section class="streaming" aria-labelledby="stream-heading">
      <h2 id="stream-heading" class="section-label">Jetzt streamen</h2>
      <!-- Album-Links „Klavier To Go“ (UPC 4050215330047). Amazon: Suche, YouTube Music: Kanal (kein Album gelistet). -->
      <ul class="services">
        <li><a class="service" href="https://open.spotify.com/album/40TdqfmzcD6UqJCsPL27O8" target="_blank" rel="noopener">
          <img src="assets/icons/spotify.svg" alt="" width="30" height="30"><span>Spotify</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="service" href="https://music.apple.com/de/album/klavier-to-go/1320059874" target="_blank" rel="noopener">
          <img src="assets/icons/applemusic.svg" alt="" width="30" height="30"><span>Apple Music</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="service" href="https://music.amazon.de/search/Tastonettis%20Klavier%20To%20Go" target="_blank" rel="noopener">
          <img src="assets/icons/amazonmusic.svg" alt="" width="30" height="30"><span>Amazon Music</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="service" href="https://music.youtube.com/channel/UCeTiOrHd3WipaU0hUhdYzvw" target="_blank" rel="noopener">
          <img src="assets/icons/youtubemusic.svg" alt="" width="30" height="30"><span>YouTube Music</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="service" href="https://www.deezer.com/de/album/52731922" target="_blank" rel="noopener">
          <img src="assets/icons/deezer.svg" alt="" width="30" height="30"><span>Deezer</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="service" href="https://tidal.com/album/81978299" target="_blank" rel="noopener">
          <img src="assets/icons/tidal.svg" alt="" width="30" height="30"><span>Tidal</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a class="service" href="https://www.qobuz.com/de-de/album/klavier-to-go-tastonettis/se1sw7d9xh7ja" target="_blank" rel="noopener">
          <img src="assets/icons/qobuz.svg" alt="" width="30" height="30"><span>Qobuz</span><span class="arrow" aria-hidden="true">→</span></a></li>
      </ul>
    </section>

    <div class="snowman-slot" id="snowman-slot" hidden>
      <canvas id="snowman-final" aria-label="Schneemann"></canvas>
    </div>

    <footer class="footer">
      <a href="https://tastonettis.de/impressum.php" target="_blank" rel="noopener">Impressum</a>
      <a href="https://tastonettis.de/datenschutz.php" target="_blank" rel="noopener">Datenschutz</a>
    </footer>
  </main>

  <!-- Schneedecke über der ganzen Seite: wegschieben baut den Schneemann. -->
  <div class="snowcover" id="snowcover">
    <canvas id="snowlayer" aria-hidden="true"></canvas>
    <canvas id="snowman" aria-hidden="true"></canvas>
    <p class="snow-hint" id="snow-hint">Schieb den Schnee weg<br>und bau einen Schneemann! ☃</p>
    <button type="button" class="snow-skip" id="snow-skip">Schnee überspringen</button>
  </div>

  <!-- Easter Egg: Handy schütteln lässt es wie in einer Schneekugel schneien. -->
  <canvas id="snowglobe" aria-hidden="true"></canvas>

  <script src="js/snow.js"></script>
  <script src="js/snowglobe.js"></script>
</body>
</html>
